name: Verify typecheck parity

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  parity:
    name: Bun and TypeScript diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR merge result
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Report checker versions
        run: |
          bun --version
          bun -p process.versions.typescript
          bunx tsc --version

      - name: Run Bun fast type check
        run: bun run check:types:fast

      - name: Run TypeScript standard check
        run: bun run check:types

      - name: Verify diagnostic parity
        run: bun run test:typecheck-parity
