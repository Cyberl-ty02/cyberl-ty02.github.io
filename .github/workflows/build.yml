name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # date-from-git follows article history to preserve original dates.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install Hexo environment
        run: bun install --frozen-lockfile

      - name: Report tool versions
        run: |
          bun --version
          bun -p process.versions.typescript
          bunx tsc --version

      - name: Check TypeScript and blog content
        run: bun run check

      - name: Build blog-owned runtime assets
        run: bun run build:runtime

      - name: Clean Hexo cache
        run: bun run clean

      - name: Hexo build site
        run: bun run build:site

      - name: Check generated pages
        run: bun run check:generated

      # Keep the Pages artifact from the normal checkout, but require the same
      # commit to build identically from a real detached linked worktree.
      - name: Verify Ubuntu linked-worktree contract
        run: bun run tools/check-linked-worktree.ts

      - name: Upload artifacts for pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
